# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: read-model
name: BankOrderView
id: bank-order-view
payload:
  {
    "id": "bank-order-view",
    "name": "BankOrderView",
    "context": "bankwealth",
    "description": "本人订单的付款、TA和独立退款分层详情；也可查看有账户归属的定投现金订单，不强求每单都有客户cashRequestSource。",
    "sourceAggregate": "FundOrder",
    "visible_to": [
      "customer"
    ],
    "fields": [
      {
        "name": "orderId",
        "dataType": "FundOrderId",
        "source": "aggregateIdentity",
        "description": "来自订单PID所对应的FundOrder身份，先查owner再读业务payload。"
      },
      {
        "name": "operationId",
        "dataType": "OperationId",
        "source": "Documentation only: BankReadside.orderView: nonempty FundOrder.operationId, else cashRequestSource.payment.operationId; FundPurchaseSettlementRequested.operationId is the settlement fold source",
        "description": "完整原现金来源在settlement事件前可提供该值；不能伪称只有一个事件直投来源。"
      },
      {
        "name": "investorAccountId",
        "dataType": "AccountId",
        "source": "Documentation only: BankReadside.orderView: nonempty FundOrder.investorAccountId, else cashRequestSource.payment.investorAccountId; FundPurchaseSettlementRequested.investorAccountId is the settlement fold source",
        "description": "完整原现金来源在settlement事件前可提供该值；不能伪称只有一个事件直投来源。"
      },
      {
        "name": "fundCollectionAccountId",
        "dataType": "AccountId",
        "source": "Documentation only: BankReadside.orderView: nonempty FundOrder.fundCollectionAccountId, else cashRequestSource.payment.fundCollectionAccountId; FundPurchaseSettlementRequested.fundCollectionAccountId is the settlement fold source",
        "description": "完整原现金来源在settlement事件前可提供该值；不能伪称只有一个事件直投来源。"
      },
      {
        "name": "fundCode",
        "dataType": "String",
        "source": "Documentation only: BankReadside.orderView: nonempty FundOrder.fundCode, else cashRequestSource.payment.fundCode; FundPurchaseSettlementRequested.fundCode is the settlement fold source",
        "description": "完整原现金来源在settlement事件前可提供该值；不能伪称只有一个事件直投来源。"
      },
      {
        "name": "amount",
        "dataType": "MoneyWire",
        "source": "Documentation only: BankReadside.orderView: FundOrder.amount if operationId nonempty, else cashRequestSource.payment.amount; MoneyToWire",
        "description": "沿用FundPurchaseSettlementRequested.amount或原请求的精确本金，不使用浮点、不提供退款替换金额。"
      },
      {
        "name": "paymentTxId",
        "dataType": "Option[TxId]",
        "source": "eventField:FundSubscriptionPaymentConfirmed.txid",
        "description": "selectedPaymentTxId非空才展示；该字段本身不等同最终付款成功。"
      },
      {
        "name": "paymentStatus",
        "dataType": "String",
        "source": "Documentation only: BankReadside.paymentStatus: FundOrder.cashPaymentFinalResults[selectedPaymentTxId], else nonempty paymentOutcome, else intent-recorded for status=new, else status",
        "description": "付款自身结果，含中间状态及五kind；succeeded不是投资成功。"
      },
      {
        "name": "taRequestId",
        "dataType": "Option[TaRequestId]",
        "source": "eventField:FundTASubmissionRegistered.taRequestId",
        "description": "空值为尚未登记，不据此判业务失败。"
      },
      {
        "name": "taStatus",
        "dataType": "String",
        "source": "Documentation only: BankReadside.taStatus: nonempty FundOrder.taStatus, else not-submitted",
        "description": "submitted/accepted/unknown与confirmed/rejected分开；实际确认事件是FundTASharesConfirmed。"
      },
      {
        "name": "taReference",
        "dataType": "Option[String]",
        "source": "Documentation only: FundOrder.taReference folded from FundTAAccepted, FundTAUnknown, FundTASharesConfirmed or FundTARejected taReference; BankReadside.orderView filters empty text",
        "description": "关联原TA请求的受信参考号；不将accepted参考号视为份额终态。"
      },
      {
        "name": "taShares",
        "dataType": "Option[BankTaSharesView]",
        "source": "eventField:FundTASharesConfirmed.shares",
        "description": "仅taStatus=confirmed时从taConfirmedShares映射fundCode、shares、nav；TaExactText原文本保持，不推导估值。"
      },
      {
        "name": "taRejectionReason",
        "dataType": "Option[String]",
        "source": "eventField:FundTARejected.reason",
        "description": "只展示非空的可信拒绝原因，UNKNOWN不补造拒绝理由。"
      },
      {
        "name": "refundOperationId",
        "dataType": "Option[OperationId]",
        "source": "eventField:FundPurchaseRefundRequested.refundOperationId",
        "description": "独立退款intent身份，不能替代付款operation或由客户提供。"
      },
      {
        "name": "refundStatus",
        "dataType": "String",
        "source": "Documentation only: BankReadside.refundStatus: nonempty FundOrder.refundOutcome, else refund-in-progress for TA rejected plus payment succeeded, else not-required",
        "description": "独立退款状态；只有succeeded表示已退本金，不覆盖付款成功事实。"
      }
    ],
    "queries": [
      {
        "context": "bankwealth",
        "kind": "port",
        "owner": [],
        "id": "BankOrderQuery"
      }
    ],
    "metadata": {
      "description": "每个查询响应的BankReadMetadata信封，不是金融终态，不并入下列业务DTO字段。所有来源说明均为文档，不声明新的可执行投影。",
      "fields": [
        {
          "name": "schemaVersion",
          "dataType": "String",
          "source": "Documentation only: BankReadsideSchema.version",
          "description": "当前查询schema为bank-query-v1。"
        },
        {
          "name": "disposition",
          "dataType": "String",
          "source": "Documentation only: BankReadside.metadata(rows, completeSet, absent)",
          "description": "完整所需集合且有水位且全部caught-up才返回caught-up；该条件下业务值缺席才not-found。否则unknown，不能把缺行或空列表当不存在。"
        },
        {
          "name": "watermarks",
          "dataType": "Vector[BankProjectionWatermark]",
          "source": "Documentation only: BankReadside.metadata: each distinct stream Row.pid/last/observed",
          "description": "每PID分别报告lastSequence与observedSequence。相等为caught-up，observed更大为catching-up，其余unknown；不是全局日志顺序或跨账户原子快照。"
        }
      ],
      "semantics": [
        "BankReadside.project在同一事务保存原event、生成状态、索引和连续checkpoint；PID＋seq相同须字节一致，冲突或gap拒绝且不跳水位。",
        "catchUp仅观察某PID的有界frontier；后续live事件将observed清空。关闭排空后frontier失效，不把上次caught-up当永久新鲜。",
        "plans和pending无有界全索引发现frontier，completeSet=false，整页metadata.disposition保持unknown，即使已列行的水位caught-up。",
        "occurrences按due_slot分页并在查询时关联订单；关联缺失可稍后重查，不生成假订单或全局chronology。",
        "查询先认证及归属判断；GET不启动账户、订单、付款、退款或补期。Unavailable/NotAuthorized等查询失败与金融失败分开。"
      ],
      "evidence": [
        "v1/integration/RELEASE-SIGNOUT-1134.md (1134既定本地demo签出；不是本次执行证明)",
        "v1/integration/ACCEPTANCE-MATRIX.md (P26-2; P31-2)",
        "v1/handwritten/scala/example/bankwealth/readside/BankReadside.scala",
        "v1/handwritten/scala/example/bankwealth/readside/BankReadsideSchema.scala",
        "truth/bank-wealth/contexts/bankwealth/value-objects/bank-read-metadata.vo.yaml",
        "truth/bank-wealth/contexts/bankwealth/value-objects/bank-projection-watermark.vo.yaml"
      ]
    },
    "evidence": [
