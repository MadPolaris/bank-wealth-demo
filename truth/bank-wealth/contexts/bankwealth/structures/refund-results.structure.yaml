              {"$value":"refund-receipt-once"},
              {"$value":"refund-terminal-once"}
            ],
            "produces": ["FundRefundCompensated"],
            "provenance": {"$value":"doc-payload-provenance"}
          },
          "events": {
            "FundRefundCompensated": {
              "name": "FundRefundCompensated",
              "payloads": {"$value":"events-fund-refund-compensated-payloads"},
              "bindings": [
