# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: saga
id: bank-cash-payment-v1
name: "Bank V1 cash purchase payment"
version: bank-v1-1
seq: 2
payload:
  {
    "schemaVersion": "truthsrc.saga/v1",
    "purpose": "Explicit bank V1: durable cash pipeline is the sole starter; investor outgoing, collection incoming, then order commit. Inherits bank-v1-p23-design-2.",
    "invariants": [
      "Investor outgoing, collection incoming and order subscription are the exact same Money; order Commit is after collection Commit.",
      "Participant resource IDs and original positive CNY principal are pinned by the source event; no legacy purchase entry triggers this Saga."
    ],
    "transactionIdType": "TxId",
    "args": [
      "investorAccountId: AccountId",
      "fundOrderId: FundOrderId",
      "fundCollectionAccountId: AccountId",
      "amount: Money"
    ],
    "participants": [
      {
        "id": "investorCreditBalance",
        "aggregate": "CreditBalance",
        "resourceRef": {
          "ref": "args:investorAccountId",
          "type": "AccountId"
        }
      },
      {
        "id": "collectionCreditBalance",
        "aggregate": "CreditBalance",
        "resourceRef": {
          "ref": "args:fundCollectionAccountId",
          "type": "AccountId"
        }
      },
      {
        "id": "orderFundOrderTCC",
        "aggregate": "FundOrder",
        "resourceRef": {
          "ref": "args:fundOrderId",
          "type": "FundOrderId"
        }
      }
    ],
    "groups": [
      {
        "id": 1,
        "dependsOn": []
      },
      {
        "id": 2,
        "dependsOn": [
          1
        ]
      },
      {
        "id": 3,
        "dependsOn": [
          2
        ]
      }
    ],
    "steps": [
      {
        "id": "reserve-investor-funds",
        "participant": "investorCreditBalance",
        "group": 1,
        "phases": {
          "prepare": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "ReserveFunds"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:investorAccountId\" : AccountId",
              "amount <- \"args:amount\" : Money"
            ],
            "outputs": [
              "txid: TxId",
              "resource: AccountId",
              "amount: Money",
              "currency: Text",
              "available: Money"
            ]
          },
          "commit": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "DeductFunds"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:investorAccountId\" : AccountId",
              {
                "slot": "amount",
                "type": "Money",
                "ref": "args:amount"
              }
            ],
            "outputs": [
              "txid: TxId",
              "resource: AccountId",
              "amount: Money"
            ]
          },
          "compensate": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "ReleaseReservedFunds"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:investorAccountId\" : AccountId",
              {
                "slot": "amount",
                "type": "Money",
                "ref": "args:amount"
              }
            ],
            "outputs": [
              "txid: TxId",
              "resource: AccountId",
              "amount: Money",
              "currency: Text",
              "available: Money"
            ]
          }
        }
      },
      {
        "id": "credit-fund-collection",
        "participant": "collectionCreditBalance",
        "group": 2,
        "phases": {
          "prepare": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "RecordIncomingCredits"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:fundCollectionAccountId\" : AccountId",
              "amount <- \"args:amount\" : Money"
            ],
            "outputs": [
              "txid: TxId",
              "resource: AccountId",
              "amount: Money"
            ]
          },
          "commit": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "CommitIncomingCredits"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:fundCollectionAccountId\" : AccountId",
              {
                "slot": "amount",
                "type": "Money",
                "ref": "args:amount"
              }
            ],
            "outputs": [
              "txid: TxId",
              "resource: AccountId",
              "amount: Money",
              "currency: Text",
              "available: Money"
            ]
          },
          "compensate": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "CancelIncomingCredit"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:fundCollectionAccountId\" : AccountId",
              {
                "slot": "amount",
                "type": "Money",
                "ref": "args:amount"
              }
            ],
            "outputs": [
              "txid: TxId",
              "resource: AccountId",
              "amount: Money"
            ]
          }
        }
      },
      {
        "id": "reserve-cash-fund-order",
        "participant": "orderFundOrderTCC",
        "group": 3,
        "phases": {
          "prepare": {
            "kind": "command",
            "commandRef": {
              "aggregate": "FundOrder",
              "name": "ReserveFundSubscription"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:fundOrderId\" : FundOrderId",
              "amount <- \"args:amount\" : Money"
            ],
            "outputs": [
              "txid: TxId",
              "resource: FundOrderId",
              "amount: Money"
            ]
          },
          "commit": {
            "kind": "command",
            "commandRef": {
              "aggregate": "FundOrder",
              "name": "ConfirmFundSubscriptionPayment"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:fundOrderId\" : FundOrderId",
              {
                "slot": "amount",
                "type": "Money",
                "ref": "args:amount"
              }
            ],
            "outputs": [
              "txid: TxId",
              "resource: FundOrderId",
              "amount: Money"
            ]
          },
          "compensate": {
            "kind": "command",
            "commandRef": {
              "aggregate": "FundOrder",
              "name": "CancelCashFundSubscription"
            },
            "bindings": [
              "txid <- txid : TxId",
              "resource <- \"args:fundOrderId\" : FundOrderId",
              {
                "slot": "amount",
                "type": "Money",
                "ref": "args:amount"
              }
            ],
            "outputs": [
              "txid: TxId",
              "resource: FundOrderId",
              "amount: Money"
            ]
          }
        }
      }
    ],
    "resilience": {
      "maxAttempts": 1,
      "phaseTimeoutMs": 1000,
      "queryTimeoutMs": 1000,
      "backoffMs": 0,
      "totalTimeoutMs": 10000
    },
    "safety": {
      "commitDecision": "durable-before-commit",
      "abortDecision": "durable-before-compensate",
      "afterCommit": "forward-recovery",
      "unknown": "reconcile-before-resume",
      "compensation": "confirmed-reservations",
      "cancelBeforePrepare": "empty-release-and-fence",
      "retryIdentity": "stable-operation",
      "manualRecovery": "authorized-reconciliation-evidence"
    },
    "admission": {
      "maxParticipants": 3,
      "maxInFlight": 1,
      "maxItemsPerChunk": 1,
      "manifest": {
        "mode": "static",
        "durable": true
      }
    },
    "triggers": [
      {
        "id": "bank-cash-request",
        "kind": "event",
        "sourceRef": {
          "aggregate": "FundOrder",
          "name": "FundPurchaseSettlementRequested"
        },
        "argsMapping": [
          {
            "slot": "investorAccountId",
            "type": "AccountId",
            "ref": "source:investorAccountId"
          },
          {
            "slot": "fundOrderId",
            "type": "FundOrderId",
            "ref": "source:fundOrderId"
          },
          {
            "slot": "fundCollectionAccountId",
            "type": "AccountId",
            "ref": "source:fundCollectionAccountId"
          },
          {
            "slot": "amount",
            "type": "Money",
            "ref": "source:amount"
          }
        ],
        "idempotency": {
          "ref": "source:operationId",
          "type": "OperationId",
          "scope": "saga-version",
          "conflict": "reject-different-args"
        }
      }
    ],
    "resultKinds": [
      "succeeded",
      "rejected-before-effects",
      "compensated",
      "recovery-required",
      "outcome-unknown"
    ],
    "completions": [
      {
        "kind": "succeeded",
        "eventRef": {
          "aggregate": "FundOrder",
          "name": "BankPaymentResultSucceeded"
        },
        "bindings": [
          "txid <- txid : TxId"
        ]
      },
      {
        "kind": "rejected-before-effects",
        "eventRef": {
          "aggregate": "FundOrder",
          "name": "BankPaymentResultRejectedBeforeEffects"
        },
        "bindings": [
          "txid <- txid : TxId"
        ]
      },
      {
        "kind": "compensated",
        "eventRef": {
          "aggregate": "FundOrder",
          "name": "BankPaymentResultCompensated"
        },
        "bindings": [
          "txid <- txid : TxId"
        ]
      },
      {
        "kind": "recovery-required",
        "eventRef": {
          "aggregate": "FundOrder",
          "name": "BankPaymentResultRecoveryRequired"
        },
        "bindings": [
          "txid <- txid : TxId"
        ]
      },
      {
        "kind": "outcome-unknown",
        "eventRef": {
          "aggregate": "FundOrder",
          "name": "BankPaymentResultOutcomeUnknown"
        },
        "bindings": [
          "txid <- txid : TxId"
        ]
      }
    ]
  }
