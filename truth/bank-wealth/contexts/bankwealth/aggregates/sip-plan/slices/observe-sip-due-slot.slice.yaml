# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: ObserveSipDueSlot
payload:
  {
    "name": "ObserveSipDueSlot",
    "parameters": [
      {
        "name": "position",
        "dataType": "Long",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "dueSlot",
        "dataType": "Long",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "SIP_INITIALIZED",
        "errCode": "SIP_INITIALIZED",
        "cond": "state.initialized",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SCHEDULE_SEALED",
        "errCode": "SIP_SCHEDULE_SEALED",
        "cond": "state.scheduleSealed",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SLOT_DECLARED",
        "errCode": "SIP_SLOT_DECLARED",
        "cond": "state.slots.contains(param.position)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SLOT_MATCH",
        "errCode": "SIP_SLOT_MATCH",
        "cond": "state.slots(param.position) == param.dueSlot",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_OBSERVATION_CONFLICT",
        "errCode": "SIP_OBSERVATION_CONFLICT",
        "cond": "!state.slotDisposition.contains(param.dueSlot) || state.slotDisposition(param.dueSlot) == \"backlog\"",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_OBSERVATION_ONCE",
        "errCode": "SIP_OBSERVATION_ONCE",
        "cond": "!state.slotDisposition.contains(param.dueSlot)",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_OBSERVATION_ORDER",
        "errCode": "SIP_OBSERVATION_ORDER",
        "cond": "param.position == state.observedCount",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SLOT_DUE",
        "errCode": "SIP_SLOT_DUE",
        "cond": "param.dueSlot <= state.currentTick",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_PAUSE_CLASSIFICATION",
        "errCode": "SIP_PAUSE_CLASSIFICATION",
        "cond": "!state.paused || param.dueSlot < state.pauseTick",
        "onFail": "reject"
      }
    ],
    "produces": [
      "SipDueSlotObserved"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipDueSlotObserved": {
      "name": "SipDueSlotObserved",
      "payloads": [
        {
          "name": "position",
          "dataType": "Long",
          "origin": "PROPAGATED"
        },
        {
          "name": "dueSlot",
          "dataType": "Long",
          "origin": "PROPAGATED"
        },
        {
          "name": "disposition",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "position",
          "expr": "param.position"
        },
        {
          "slot": "dueSlot",
          "expr": "param.dueSlot"
        },
        {
          "slot": "disposition",
          "expr": "literal:backlog"
        }
      ],
      "foldAssignments": [
        {
          "slot": "slotDisposition",
          "op": "put",
          "key": "event.dueSlot",
          "value": "event.disposition"
        },
        {
          "slot": "observedCount",
          "op": "integer-apply",
          "delta": "literal:1",
          "sign": 1
        }
      ]
    }
  }
