      "@guard[invariantRef](succeed-empty SIP_SEAL_ONCE/SIP_SEAL_ONCE: \"!state.scheduleSealed\")",
      "@guard[invariantRef](reject SIP_FINITE_SCHEDULE/SIP_FINITE_SCHEDULE: \"state.scheduleCount > 0\")"
    ],
    "produces": [
      "SipScheduleSealed"
    ],
