kind: slice
aggregate: SipPlan
command: RecordSipCreateIntent
payload:
  {
    "name": "RecordSipCreateIntent",
    "parameters": [
      "intent: BankSipCreateIntent @BUSINESS_INPUT",
      "source: \"Option[BankSipCreateIntent]\" @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject SIP_INTENT_OPTION/SIP_INTENT_OPTION: \"param.source.contains(param.intent)\")",
      "@guard[invariantRef](reject SIP_INTENT_RESOURCE/SIP_INTENT_RESOURCE: \"param.intent.planId == state.id\")",
      "@guard[invariantRef](reject SIP_INTENT_BODY/SIP_INTENT_BODY: \"param.intent.principalId.nonEmpty && param.intent.clientRequestId.nonEmpty && param.intent.authorityVersion.nonEmpty && param.intent.clientRequestId == param.intent.request.clientRequestId && param.intent.request.fundCode == param.intent.config.fundCode && param.intent.request.effectiveSlot == param.intent.config.effectiveSlot && param.intent.request.amount.currency == param.intent.config.amount.currency && param.intent.request.dueSlots.nonEmpty\")",
      "@guard[invariantRef](reject SIP_INTENT_CONFLICT/SIP_INTENT_CONFLICT: \"state.createIntent.isEmpty || state.createIntent.contains(param.intent)\")",
      "@guard[invariantRef](reject SIP_INTENT_EXISTING_CONFIG/SIP_INTENT_EXISTING_CONFIG: \"!state.initialized || (param.intent.planId == state.id && state.revisions.contains(param.intent.config.revision) && state.revisions(param.intent.config.revision) == param.intent.config)\")",
      "@guard[invariantRef](succeed-empty SIP_INTENT_ONCE/SIP_INTENT_ONCE: state.createIntent.isEmpty)",
      "@guard[invariantRef](reject SIP_INTENT_BEFORE_CREATE/SIP_INTENT_BEFORE_CREATE: \"!state.initialized && state.scheduleCount == 0 && !state.scheduleSealed\")"
    ],
    "produces": [
      "SipCreateIntentRecorded"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1-service-integration",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-service-integration-619",
      "sourceFlow": "P26-P32",
      "approval": "approved P26-P32 plan and bank-service-integration/v1; not a historical workshop"
    }
  }
events:
  {
    "SipCreateIntentRecorded": {
      "name": "SipCreateIntentRecorded",
      "payloads": [
        "intent: BankSipCreateIntent @PROPAGATED",
        "source: \"Option[BankSipCreateIntent]\" @PROPAGATED"
      ],
      "bindings": [
        "intent <- param.intent",
        "source <- param.source"
      ],
      "foldAssignments": [
        "createIntent := event.source",
        "sipCreateIntents := @fold[put](key=\"literal:original\", value=event.intent)",
        "createIntentDueSlots := event.intent.request.dueSlots"
      ]
    }
  }
