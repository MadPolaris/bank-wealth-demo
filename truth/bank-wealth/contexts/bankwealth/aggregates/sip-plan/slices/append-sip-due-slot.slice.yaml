# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: AppendSipDueSlot
payload:
  {
    "name": "AppendSipDueSlot",
    "parameters": [
      "position: Long @BUSINESS_INPUT",
      "dueSlot: Long @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject SIP_ADMITTED_SLOT_MEMBER/SIP_ADMITTED_SLOT_MEMBER: \"state.createIntent.isEmpty || state.createIntentDueSlots.contains(param.dueSlot)\")",
      "@guard[invariantRef](reject SIP_INITIALIZED/SIP_INITIALIZED: state.initialized)",
      "@guard[invariantRef](reject SIP_SLOT_REPLAY_CONFLICT/SIP_SLOT_REPLAY_CONFLICT: \"!state.slots.contains(param.position) || state.slots(param.position) == param.dueSlot\")",
      "@guard[invariantRef](succeed-empty SIP_SLOT_ONCE/SIP_SLOT_ONCE: \"!state.slots.contains(param.position)\")",
      "@guard[invariantRef](reject SIP_SCHEDULE_OPEN/SIP_SCHEDULE_OPEN: \"!state.scheduleSealed\")",
      "@guard[invariantRef](reject SIP_SLOT_POSITION/SIP_SLOT_POSITION: \"param.position == state.scheduleCount && param.position < 9223372036854775807\")",
      "@guard[invariantRef](reject SIP_SLOT_ORDER/SIP_SLOT_ORDER: \"param.dueSlot > state.lastDueSlot && param.dueSlot >= state.latestEffectiveSlot\")"
    ],
    "produces": [
      "SipDueSlotAppended"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ],
      "serviceIntegration": {
        "author": "agent-assisted-bank-v1-service-integration",
        "workshopHeld": false,
        "sourceVersion": "bank-v1-service-integration-619",
        "sourceFlow": "P26-P32",
        "approval": "approved P26-P32 plan and bank-service-integration/v1; not a historical workshop"
      }
    }
  }
events:
  {
    "SipDueSlotAppended": {
      "name": "SipDueSlotAppended",
      "payloads": [
        "position: Long @PROPAGATED",
        "dueSlot: Long @PROPAGATED"
      ],
      "bindings": [
        "position <- param.position",
        "dueSlot <- param.dueSlot"
      ],
      "foldAssignments": [
        "slots := @fold[put](key=event.position, value=event.dueSlot)",
        "scheduleCount := @fold[integer-apply](delta=\"literal:1\", sign=+1)",
        "lastDueSlot := event.dueSlot",
        "intentAppendedDueSlots := @fold[put](key=event.dueSlot, value=event.position)"
      ]
    }
  }
