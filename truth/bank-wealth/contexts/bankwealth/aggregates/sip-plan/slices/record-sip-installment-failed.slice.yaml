# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: RecordSipInstallmentFailed
payload:
  {
    "name": "RecordSipInstallmentFailed",
    "parameters": [
      "occurrence: SipOccurrence @BUSINESS_INPUT",
      "evidence: String @BUSINESS_INPUT",
      "receiptId: String @BUSINESS_INPUT",
      "receiptBody: String @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject SIP_INITIALIZED/SIP_INITIALIZED: state.initialized)",
      "@guard[invariantRef](reject SIP_OCCURRENCE_KNOWN/SIP_OCCURRENCE_KNOWN: \"state.occurrences.contains(param.occurrence.dueSlot)\")",
      "@guard[invariantRef](reject SIP_ORIGINAL_ASSOCIATION/SIP_ORIGINAL_ASSOCIATION: \"state.occurrences(param.occurrence.dueSlot) == param.occurrence && param.occurrence.planId == state.id\")",
      "@guard[invariantRef](reject SIP_TERMINAL_EVIDENCE/SIP_TERMINAL_EVIDENCE: \"param.evidence == \\\"payment-rejected-before-effects\\\" || param.evidence == \\\"payment-compensated\\\" || param.evidence == \\\"ta-rejected-refund-completed\\\"\")",
      "@guard[invariantRef](reject SIP_TERMINAL_RECEIPT/SIP_TERMINAL_RECEIPT: \"param.receiptId.nonEmpty && param.receiptBody.nonEmpty\")",
      "@guard[invariantRef](reject SIP_TERMINAL_RECEIPT_CONFLICT/SIP_TERMINAL_RECEIPT_CONFLICT: \"!state.terminalReceiptBodies.contains(param.receiptId) || state.terminalReceiptBodies(param.receiptId) == param.receiptBody\")",
      "@guard[invariantRef](reject SIP_TERMINAL_CONFLICT/SIP_TERMINAL_CONFLICT: \"!state.firstTerminals.contains(param.occurrence.occurrenceId) || state.firstTerminals(param.occurrence.occurrenceId) == \\\"failed\\\"\")",
      "@guard[invariantRef](succeed-empty SIP_TERMINAL_ONCE/SIP_TERMINAL_ONCE: \"!state.firstTerminals.contains(param.occurrence.occurrenceId)\")",
      "@guard[invariantRef](reject SIP_TOTAL_CAPACITY/SIP_TOTAL_CAPACITY: \"state.failureTotal < 9223372036854775807\")"
    ],
    "produces": [
      "SipInstallmentFailed"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipInstallmentFailed": {
      "name": "SipInstallmentFailed",
      "payloads": [
        "occurrence: SipOccurrence @PROPAGATED",
        "evidence: String @PROPAGATED",
        "receiptId: String @PROPAGATED",
        "receiptBody: String @PROPAGATED",
        "outcome: String @PROPAGATED"
      ],
      "bindings": [
        "occurrence <- param.occurrence",
        "evidence <- param.evidence",
        "receiptId <- param.receiptId",
        "receiptBody <- param.receiptBody",
        "outcome <- \"literal:failed\""
      ],
      "foldAssignments": [
        "firstTerminals := @fold[put](key=event.occurrence.occurrenceId, value=event.outcome)",
        "occurrenceProgress := @fold[put](key=event.occurrence.occurrenceId, value=event.outcome)",
        "terminalReceiptBodies := @fold[put](key=event.receiptId, value=event.receiptBody)",
        "failureTotal := @fold[integer-apply](delta=\"literal:1\", sign=+1)"
      ]
    }
  }
