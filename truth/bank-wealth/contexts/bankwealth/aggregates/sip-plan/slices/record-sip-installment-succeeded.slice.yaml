# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: RecordSipInstallmentSucceeded
payload:
  {
    "name": "RecordSipInstallmentSucceeded",
    "parameters": [
      {
        "name": "occurrence",
        "dataType": "SipOccurrence",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "evidence",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptId",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptBody",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "SIP_INITIALIZED",
        "errCode": "SIP_INITIALIZED",
        "cond": "state.initialized",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_OCCURRENCE_KNOWN",
        "errCode": "SIP_OCCURRENCE_KNOWN",
        "cond": "state.occurrences.contains(param.occurrence.dueSlot)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_ORIGINAL_ASSOCIATION",
        "errCode": "SIP_ORIGINAL_ASSOCIATION",
        "cond": "state.occurrences(param.occurrence.dueSlot) == param.occurrence && param.occurrence.planId == state.id",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_TERMINAL_EVIDENCE",
        "errCode": "SIP_TERMINAL_EVIDENCE",
        "cond": "param.evidence == \"ta-confirmed\"",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_TERMINAL_RECEIPT",
        "errCode": "SIP_TERMINAL_RECEIPT",
        "cond": "param.receiptId.nonEmpty && param.receiptBody.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_TERMINAL_RECEIPT_CONFLICT",
        "errCode": "SIP_TERMINAL_RECEIPT_CONFLICT",
        "cond": "!state.terminalReceiptBodies.contains(param.receiptId) || state.terminalReceiptBodies(param.receiptId) == param.receiptBody",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_TERMINAL_CONFLICT",
        "errCode": "SIP_TERMINAL_CONFLICT",
        "cond": "!state.firstTerminals.contains(param.occurrence.occurrenceId) || state.firstTerminals(param.occurrence.occurrenceId) == \"succeeded\"",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_TERMINAL_ONCE",
        "errCode": "SIP_TERMINAL_ONCE",
        "cond": "!state.firstTerminals.contains(param.occurrence.occurrenceId)",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_TOTAL_CAPACITY",
        "errCode": "SIP_TOTAL_CAPACITY",
        "cond": "state.successTotal < 9223372036854775807",
        "onFail": "reject"
      }
    ],
    "produces": [
      "SipInstallmentSucceeded"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipInstallmentSucceeded": {
      "name": "SipInstallmentSucceeded",
      "payloads": [
        {
          "name": "occurrence",
          "dataType": "SipOccurrence",
          "origin": "PROPAGATED"
        },
        {
          "name": "evidence",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptId",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptBody",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "outcome",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "occurrence",
          "expr": "param.occurrence"
        },
        {
          "slot": "evidence",
          "expr": "param.evidence"
        },
        {
          "slot": "receiptId",
          "expr": "param.receiptId"
        },
        {
          "slot": "receiptBody",
          "expr": "param.receiptBody"
        },
        {
          "slot": "outcome",
          "expr": "literal:succeeded"
        }
      ],
      "foldAssignments": [
        {
          "slot": "firstTerminals",
          "op": "put",
          "key": "event.occurrence.occurrenceId",
          "value": "event.outcome"
        },
        {
          "slot": "occurrenceProgress",
          "op": "put",
          "key": "event.occurrence.occurrenceId",
          "value": "event.outcome"
        },
        {
          "slot": "terminalReceiptBodies",
          "op": "put",
          "key": "event.receiptId",
          "value": "event.receiptBody"
        },
        {
          "slot": "successTotal",
          "op": "integer-apply",
          "delta": "literal:1",
          "sign": 1
        }
      ]
    }
  }
