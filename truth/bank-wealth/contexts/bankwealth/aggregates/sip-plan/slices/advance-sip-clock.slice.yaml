# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: AdvanceSipClock
payload:
  {
    "name": "AdvanceSipClock",
    "parameters": [
      "tick: Long @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject SIP_INITIALIZED/SIP_INITIALIZED: state.initialized)",
      "@guard[invariantRef](reject SIP_SCHEDULE_SEALED/SIP_SCHEDULE_SEALED: state.scheduleSealed)",
      "@guard[invariantRef](reject SIP_CLOCK_MONOTONE/SIP_CLOCK_MONOTONE: \"param.tick >= state.currentTick && param.tick >= 0\")",
      "@guard[invariantRef](succeed-empty SIP_CLOCK_ONCE/SIP_CLOCK_ONCE: \"param.tick != state.currentTick\")"
    ],
    "produces": [
      "SipClockAdvanced"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipClockAdvanced": {
      "name": "SipClockAdvanced",
      "payloads": [
        "tick: Long @PROPAGATED"
      ],
      "bindings": [
        "tick <- param.tick"
      ],
      "foldAssignments": [
        "currentTick := event.tick"
      ]
    }
  }
