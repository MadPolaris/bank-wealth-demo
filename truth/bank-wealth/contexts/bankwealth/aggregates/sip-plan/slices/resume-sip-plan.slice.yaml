# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: ResumeSipPlan
payload:
  {
    "name": "ResumeSipPlan",
    "parameters": [
      "tick: Long @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject SIP_INITIALIZED/SIP_INITIALIZED: state.initialized)",
      "@guard[invariantRef](reject SIP_SCHEDULE_SEALED/SIP_SCHEDULE_SEALED: state.scheduleSealed)",
      "@guard[invariantRef](reject SIP_RESUME_CLOCK/SIP_RESUME_CLOCK: \"param.tick == state.currentTick\")",
      "@guard[invariantRef](succeed-empty SIP_RESUME_ONCE/SIP_RESUME_ONCE: state.paused)",
      "@guard[invariantRef](reject SIP_RESUME_CLASSIFIED/SIP_RESUME_CLASSIFIED: \"state.observedCount == state.scheduleCount || (state.slots.contains(state.observedCount) && state.slots(state.observedCount) > state.currentTick)\")"
    ],
    "produces": [
      "SipPlanResumed"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipPlanResumed": {
      "name": "SipPlanResumed",
      "payloads": [
        "tick: Long @PROPAGATED",
        "pauseTick: Long @PROPAGATED"
      ],
      "bindings": [
        "tick <- param.tick",
        "pauseTick <- state.pauseTick"
      ],
      "foldAssignments": [
        "paused := \"literal:false\"",
        "pauseIntervals := @fold[put](key=event.pauseTick, value=event.tick)"
      ]
    }
  }
