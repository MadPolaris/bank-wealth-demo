# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: ReviseSipPlan
payload:
  {
    "name": "ReviseSipPlan",
    "parameters": [
      {
        "name": "config",
        "dataType": "SipRevisionConfig",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "SIP_INITIALIZED",
        "errCode": "SIP_INITIALIZED",
        "cond": "state.initialized",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_REVISION_REPLAY_CONFLICT",
        "errCode": "SIP_REVISION_REPLAY_CONFLICT",
        "cond": "!state.revisions.contains(param.config.revision) || state.revisions(param.config.revision) == param.config",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_REVISION_ONCE",
        "errCode": "SIP_REVISION_ONCE",
        "cond": "!state.revisions.contains(param.config.revision)",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_REVISION_ID",
        "errCode": "SIP_REVISION_ID",
        "cond": "param.config.revision.value.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_EFFECTIVE_SLOT",
        "errCode": "SIP_EFFECTIVE_SLOT",
        "cond": "param.config.effectiveSlot >= 0",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CONFIG_ACCOUNTS",
        "errCode": "SIP_CONFIG_ACCOUNTS",
        "cond": "param.config.investorAccountId.value.nonEmpty && param.config.fundCollectionAccountId.value.nonEmpty && param.config.investorAccountId != param.config.fundCollectionAccountId",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CONFIG_FUND",
        "errCode": "SIP_CONFIG_FUND",
        "cond": "param.config.fundCode.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CONFIG_AMOUNT",
        "errCode": "SIP_CONFIG_AMOUNT",
        "cond": "param.config.amount.currency == \"CNY\" && param.config.amount.amount > 0.00",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_REVISION_FUTURE",
        "errCode": "SIP_REVISION_FUTURE",
        "cond": "param.config.effectiveSlot > state.currentTick && param.config.effectiveSlot > state.latestEffectiveSlot",
        "onFail": "reject"
      }
    ],
    "produces": [
      "SipPlanRevised"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipPlanRevised": {
      "name": "SipPlanRevised",
      "payloads": [
        {
          "name": "config",
          "dataType": "SipRevisionConfig",
          "origin": "PROPAGATED"
        },
        {
          "name": "previousRevision",
          "dataType": "RevisionId",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "config",
          "expr": "param.config"
        },
        {
          "slot": "previousRevision",
          "expr": "state.latestRevision"
        }
      ],
      "foldAssignments": [
        {
          "slot": "revisions",
          "op": "put",
          "key": "event.config.revision",
          "value": "event.config"
        },
        {
          "slot": "revisionEnds",
          "op": "put",
          "key": "event.previousRevision",
          "value": "event.config.effectiveSlot"
        },
        {
          "slot": "latestRevision",
          "expr": "event.config.revision"
        },
        {
          "slot": "latestEffectiveSlot",
          "expr": "event.config.effectiveSlot"
        }
      ]
    }
  }
