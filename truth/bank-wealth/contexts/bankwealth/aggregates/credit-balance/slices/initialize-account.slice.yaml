# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: CreditBalance
command: InitializeAccount
payload:
  {
    "name": "InitializeAccount",
    "parameters": [
      {
        "name": "resource",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "currency",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "amount",
        "dataType": "Money",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "ACCOUNT_ID",
        "errCode": "ACCOUNT_ID",
        "cond": "param.resource == state.id",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ACCOUNT_CURRENCY",
        "errCode": "ACCOUNT_CURRENCY",
        "cond": "param.currency == \"CNY\" && param.amount.currency == param.currency",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ACCOUNT_INIT_CONFLICT",
        "errCode": "ACCOUNT_INIT_CONFLICT",
        "cond": "!state.initialized || state.accountBalance.get(param.currency).contains(param.amount)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ACCOUNT_INIT_ONCE",
        "errCode": "ACCOUNT_INIT_ONCE",
        "cond": "!state.initialized",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "ACCOUNT_SEED_NONNEGATIVE",
        "errCode": "ACCOUNT_SEED_NONNEGATIVE",
        "cond": "param.amount.amount >= 0.00",
        "onFail": "reject"
      }
    ],
    "produces": [
      "AccountInitialized"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "approvedBy": "user-approved-p24-p25-bank-joint",
      "sourceVersion": "bank-v1-p23-design-2"
    }
  }
events:
  {
    "AccountInitialized": {
      "name": "AccountInitialized",
      "payloads": [
        {
          "name": "resource",
          "dataType": "AccountId",
          "origin": "PROPAGATED"
        },
        {
          "name": "currency",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "amount",
          "dataType": "Money",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "resource",
          "expr": "param.resource"
        },
        {
          "slot": "currency",
          "expr": "param.currency"
        },
        {
          "slot": "amount",
          "expr": "param.amount"
        }
      ],
      "foldAssignments": [
        {
          "slot": "initialized",
          "expr": "literal:true"
        },
        {
          "slot": "accountBalance",
          "op": "put",
          "key": "event.currency",
          "value": "event.amount"
        }
      ]
    }
  }
