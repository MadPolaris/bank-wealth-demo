# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RecordFundTARejected
payload:
  {
    "name": "RecordFundTARejected",
    "parameters": [
      "fundOrderId: FundOrderId @BUSINESS_INPUT",
      "paymentTxId: TxId @BUSINESS_INPUT",
      "taRequestId: TaRequestId @BUSINESS_INPUT",
      "taReference: String @BUSINESS_INPUT",
      "receiptId: String @BUSINESS_INPUT",
      "receiptBody: String @BUSINESS_INPUT",
      "fundCode: String @BUSINESS_INPUT",
      "currency: String @BUSINESS_INPUT",
      "reason: String @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject TA_ORDER/TA_ORDER: \"param.fundOrderId == state.id\")",
      "@guard[invariantRef](reject TA_PAYMENT/TA_PAYMENT: \"param.paymentTxId == state.selectedPaymentTxId && state.cashPaymentFinalResults.get(param.paymentTxId).contains(\\\"succeeded\\\")\")",
      "@guard[invariantRef](reject TA_REQUEST/TA_REQUEST: \"param.taRequestId == state.taRequestId && param.taRequestId.value.nonEmpty\")",
      "@guard[invariantRef](reject TA_REFERENCE/TA_REFERENCE: \"param.taReference.nonEmpty && (state.taReference.isEmpty || state.taReference == param.taReference)\")",
      "@guard[invariantRef](reject TA_FUND/TA_FUND: \"param.fundCode == state.fundCode && param.currency == state.amount.currency\")",
      "@guard[invariantRef](reject TA_RECEIPT_PRESENT/TA_RECEIPT_PRESENT: \"param.receiptId.nonEmpty && param.receiptBody.nonEmpty\")",
      "@guard[invariantRef](reject TA_RECEIPT_CONFLICT/TA_RECEIPT_CONFLICT: \"!state.taReceipts.contains(param.receiptId) || (state.taReceipts(param.receiptId) == param.receiptBody && state.taReceiptOutcomes.get(param.receiptId).contains(\\\"rejected\\\"))\")",
      "@guard[invariantRef](succeed-empty TA_RECEIPT_ONCE/TA_RECEIPT_ONCE: \"!state.taReceipts.contains(param.receiptId)\")",
      "@guard[invariantRef](reject TA_TERMINAL_CONFLICT/TA_TERMINAL_CONFLICT: \"state.taStatus != \\\"confirmed\\\" && state.taStatus != \\\"rejected\\\"\")",
      "@guard[invariantRef](reject TA_REJECTION_REASON/TA_REJECTION_REASON: param.reason.nonEmpty)"
    ],
    "produces": [
      "FundTARejected"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundTARejected": {
      "name": "FundTARejected",
      "payloads": [
        "fundOrderId: FundOrderId @PROPAGATED",
        "paymentTxId: TxId @PROPAGATED",
        "taRequestId: TaRequestId @PROPAGATED",
        "taReference: String @PROPAGATED",
        "receiptId: String @PROPAGATED",
        "receiptBody: String @PROPAGATED",
        "fundCode: String @PROPAGATED",
        "currency: String @PROPAGATED",
        "reason: String @PROPAGATED",
        "outcome: String @PROPAGATED"
      ],
      "bindings": [
        "fundOrderId <- param.fundOrderId",
        "paymentTxId <- param.paymentTxId",
        "taRequestId <- param.taRequestId",
        "taReference <- param.taReference",
        "receiptId <- param.receiptId",
        "receiptBody <- param.receiptBody",
        "fundCode <- param.fundCode",
        "currency <- param.currency",
        "reason <- param.reason",
        "outcome <- \"literal:rejected\""
      ],
      "foldAssignments": [
        "taReceipts := @fold[put](key=event.receiptId, value=event.receiptBody)",
        "taReceiptOutcomes := @fold[put](key=event.receiptId, value=event.outcome)",
        "taReference := event.taReference",
        "taStatus := event.outcome",
        "taRejectionReason := event.reason"
      ]
    }
  }
