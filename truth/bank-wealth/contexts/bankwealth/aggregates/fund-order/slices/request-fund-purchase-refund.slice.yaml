# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RequestFundPurchaseRefund
payload:
  {
    "name": "RequestFundPurchaseRefund",
    "parameters": [
      "fundOrderId: FundOrderId @BUSINESS_INPUT",
      "paymentTxId: TxId @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject REFUND_RESOURCE/REFUND_RESOURCE: \"param.fundOrderId == state.id\")",
      "@guard[invariantRef](reject REFUND_PAYMENT/REFUND_PAYMENT: \"param.paymentTxId == state.selectedPaymentTxId && state.cashPaymentFinalResults.get(param.paymentTxId).contains(\\\"succeeded\\\")\")",
      "@guard[invariantRef](reject REFUND_TA_REJECTED/REFUND_TA_REJECTED: \"state.taStatus == \\\"rejected\\\"\")",
      "@guard[invariantRef](succeed-empty REFUND_INTENT_ONCE/REFUND_INTENT_ONCE: state.refundOperationId.value.isEmpty)"
    ],
    "produces": [
      "FundPurchaseRefundRequested"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundPurchaseRefundRequested": {
      "name": "FundPurchaseRefundRequested",
      "payloads": [
        "fundOrderId: FundOrderId @PROPAGATED",
        "paymentTxId: TxId @PROPAGATED",
        "investorAccountId: AccountId @PROPAGATED",
        "fundCollectionAccountId: AccountId @PROPAGATED",
        "amount: Money @PROPAGATED",
        "refundOperationId: OperationId @PROPAGATED"
      ],
      "bindings": [
        "fundOrderId <- param.fundOrderId",
        "paymentTxId <- param.paymentTxId",
        "investorAccountId <- state.investorAccountId",
        "fundCollectionAccountId <- state.fundCollectionAccountId",
        "amount <- state.amount",
        "refundOperationId <- @host(bankwealth:port#StableRefundOperationId@bank-v1-1)"
      ],
      "foldAssignments": [
        "refundOperationId := event.refundOperationId",
        "refundOutcome := \"literal:pending\""
      ]
    }
  }
