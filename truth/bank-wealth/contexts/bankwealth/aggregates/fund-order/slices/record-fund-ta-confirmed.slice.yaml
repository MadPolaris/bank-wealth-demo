        {
          "name": "taReference",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptId",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptBody",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "fundCode",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "currency",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "shares",
          "dataType": "FundShare",
          "origin": "PROPAGATED"
        },
        {
          "name": "outcome",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "fundOrderId",
          "expr": "param.fundOrderId"
        },
        {
          "slot": "paymentTxId",
          "expr": "param.paymentTxId"
        },
        {
          "slot": "taRequestId",
          "expr": "param.taRequestId"
        },
        {
          "slot": "taReference",
          "expr": "param.taReference"
        },
        {
          "slot": "receiptId",
          "expr": "param.receiptId"
        },
        {
          "slot": "receiptBody",
          "expr": "param.receiptBody"
        },
        {
          "slot": "fundCode",
          "expr": "param.fundCode"
        },
        {
          "slot": "currency",
          "expr": "param.currency"
        },
        {
          "slot": "shares",
          "expr": "param.shares"
        },
        {
          "slot": "outcome",
          "expr": "literal:confirmed"
        }
      ],
      "foldAssignments": [
        {
          "slot": "taReceipts",
          "op": "put",
          "key": "event.receiptId",
          "value": "event.receiptBody"
        },
        {
          "slot": "taReceiptOutcomes",
          "op": "put",
          "key": "event.receiptId",
          "value": "event.outcome"
        },
        {
          "slot": "taReference",
          "expr": "event.taReference"
        },
        {
          "slot": "taStatus",
          "expr": "event.outcome"
        },
        {
          "slot": "taConfirmedShares",
          "expr": "event.shares"
        }
      ]
    }
  }
