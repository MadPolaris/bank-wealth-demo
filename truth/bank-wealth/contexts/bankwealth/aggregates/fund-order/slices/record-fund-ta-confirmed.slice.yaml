# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RecordFundTAConfirmed
payload:
  {
    "name": "RecordFundTAConfirmed",
    "parameters": [
      {
        "name": "fundOrderId",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "paymentTxId",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "taRequestId",
        "dataType": "TaRequestId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "taReference",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptId",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptBody",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "fundCode",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "currency",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "shares",
        "dataType": "FundShare",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "TA_ORDER",
        "errCode": "TA_ORDER",
        "cond": "param.fundOrderId == state.id",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_PAYMENT",
        "errCode": "TA_PAYMENT",
        "cond": "param.paymentTxId == state.selectedPaymentTxId && state.cashPaymentFinalResults.get(param.paymentTxId).contains(\"succeeded\")",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_REQUEST",
        "errCode": "TA_REQUEST",
        "cond": "param.taRequestId == state.taRequestId && param.taRequestId.value.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_REFERENCE",
        "errCode": "TA_REFERENCE",
        "cond": "param.taReference.nonEmpty && (state.taReference.isEmpty || state.taReference == param.taReference)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_FUND",
        "errCode": "TA_FUND",
        "cond": "param.fundCode == state.fundCode && param.currency == state.amount.currency",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_RECEIPT_PRESENT",
        "errCode": "TA_RECEIPT_PRESENT",
        "cond": "param.receiptId.nonEmpty && param.receiptBody.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_RECEIPT_CONFLICT",
        "errCode": "TA_RECEIPT_CONFLICT",
        "cond": "!state.taReceipts.contains(param.receiptId) || (state.taReceipts(param.receiptId) == param.receiptBody && state.taReceiptOutcomes.get(param.receiptId).contains(\"confirmed\"))",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_RECEIPT_ONCE",
        "errCode": "TA_RECEIPT_ONCE",
        "cond": "!state.taReceipts.contains(param.receiptId)",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_TERMINAL_CONFLICT",
        "errCode": "TA_TERMINAL_CONFLICT",
        "cond": "state.taStatus != \"confirmed\" && state.taStatus != \"rejected\"",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_SHARE_FUND",
        "errCode": "TA_SHARE_FUND",
        "cond": "param.shares.fundCode == state.fundCode && param.shares.shares.value.nonEmpty && param.shares.nav.value.nonEmpty",
        "onFail": "reject"
      }
    ],
    "produces": [
      "FundTASharesConfirmed"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundTASharesConfirmed": {
      "name": "FundTASharesConfirmed",
      "payloads": [
        {
          "name": "fundOrderId",
          "dataType": "FundOrderId",
          "origin": "PROPAGATED"
        },
        {
          "name": "paymentTxId",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "taRequestId",
