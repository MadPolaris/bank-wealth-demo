# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RegisterFundTASubmission
payload:
  {
    "name": "RegisterFundTASubmission",
    "parameters": [
      "fundOrderId: FundOrderId @BUSINESS_INPUT",
      "paymentTxId: TxId @BUSINESS_INPUT"
    ],
    "guards": [
      "@guard[invariantRef](reject TA_SUBMIT_RESOURCE/TA_SUBMIT_RESOURCE: \"param.fundOrderId == state.id\")",
      "@guard[invariantRef](reject TA_PAID/TA_PAID: \"param.paymentTxId == state.selectedPaymentTxId && state.cashPaymentFinalResults.get(param.paymentTxId).contains(\\\"succeeded\\\")\")",
      "@guard[invariantRef](succeed-empty TA_SUBMIT_ONCE/TA_SUBMIT_ONCE: state.taRequestId.value.isEmpty)"
    ],
    "produces": [
      "FundTASubmissionRegistered"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundTASubmissionRegistered": {
      "name": "FundTASubmissionRegistered",
      "payloads": [
        "fundOrderId: FundOrderId @PROPAGATED",
        "paymentTxId: TxId @PROPAGATED",
        "taRequestId: TaRequestId @PROPAGATED"
      ],
      "bindings": [
        "fundOrderId <- param.fundOrderId",
        "paymentTxId <- param.paymentTxId",
        "taRequestId <- @host(bankwealth:port#StableTaRequestId@bank-v1-1)"
      ],
      "foldAssignments": [
        "taRequestId := event.taRequestId",
        "taStatus := \"literal:submitted\""
      ]
    }
  }
