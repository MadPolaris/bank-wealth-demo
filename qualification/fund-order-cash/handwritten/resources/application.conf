# No network, cluster, JDBC, MongoDB, Java serialization or external services are used.
akka.actor.provider = local
akka.loglevel = WARNING
akka.actor.allow-java-serialization = off
akka.actor.warn-about-java-serializer-usage = on
akka.actor.serialization-bindings {
  "net.imadz.common.CborSerializable" = jackson-cbor
  "fixture.wealth.qualification.domain.entities.FundOrderEntity$FundOrderState" = jackson-cbor
  "fixture.wealth.qualification.domain.values.Money" = jackson-cbor
  "fixture.wealth.qualification.domain.values.FundShare" = jackson-cbor
}
akka.serialization.jackson.jackson-modules += "fixture.wealth.qualification.ExactDomainJacksonModule"
akka.serialization.jackson.jackson-cbor.compression.algorithm = off
akka.serialization.jackson.deserialization-features.FAIL_ON_TRAILING_TOKENS = on
akka.persistence.testkit.events.serialize = true
akka.persistence.testkit.snapshots.serialize = true
