# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: pipeline
id: fund-purchase-invoke
name: "Direct mutual fund purchase and T+1 TA share confirmation"
description: "Executable composition: invoke fund-subscription-pay v1 to deduct core account funds and settle the FundOrder, then await the bounded durable fund-ta-settlement child plan."
steps:
  [
    {
      "id": "pay-subscription",
      "name": "Invoke fund-subscription-pay v1",
      "description": "Atomically reserve and deduct core bank balance and confirm FundOrder payment settlement.",
      "execution": {
        "invokeSaga": {
          "ref": {
            "sagaId": "fund-subscription-pay",
            "version": "v1"
          },
          "args": [
            {
              "slot": "investorAccountId",
              "ref": "input:investorAccountId",
              "type": "AccountId"
            },
            {
              "slot": "fundOrderId",
              "ref": "input:fundOrderId",
              "type": "FundOrderId"
            },
            {
              "slot": "amount",
              "ref": "input:amount",
              "type": "Money"
            }
          ],
          "transactionIdentity": {
            "type": "TxId",
            "derivation": "durable-source-stage",
            "source": {
              "ref": "input:operation",
              "type": "OperationId"
            },
            "stageId": "pay-subscription",
            "stageOccurrence": {
              "ref": "input:occurrence",
              "type": "OperationId"
            },
            "scope": "saga-version",
            "conflict": "reject-different-args"
          },
          "start": "durable-intent-before-start",
          "completionMode": "await-terminal",
          "results": [
            {
              "resultKind": "succeeded",
              "code": "Succeeded",
              "outputs": [
                {
                  "slot": "txid",
                  "ref": "result:txid",
                  "type": "TxId"
                }
              ]
            },
            {
              "resultKind": "rejected-before-effects",
              "code": "Rejected",
              "outputs": []
            },
            {
              "resultKind": "compensated",
              "code": "Compensated",
              "outputs": []
            },
            {
              "resultKind": "recovery-required",
              "code": "RecoveryRequired",
              "outputs": []
            },
            {
              "resultKind": "outcome-unknown",
              "code": "Unknown",
              "outputs": []
            }
          ]
        },
        "reads": [
          {
            "slot": "operation",
            "ref": "input:operation",
            "type": "OperationId"
          },
          {
            "slot": "occurrence",
            "ref": "input:occurrence",
            "type": "OperationId"
          },
          {
            "slot": "investorAccountId",
            "ref": "input:investorAccountId",
            "type": "AccountId"
          },
          {
            "slot": "fundOrderId",
            "ref": "input:fundOrderId",
            "type": "FundOrderId"
          },
          {
            "slot": "amount",
            "ref": "input:amount",
            "type": "Money"
          }
        ],
        "writes": [
          {
            "id": "paymentTxid",
            "slot": "txid",
            "type": "TxId",
            "durability": "durable-reference"
          }
        ],
        "outcomes": [
          {
            "code": "Succeeded",
            "kind": "success",
            "action": "continue"
          },
          {
            "code": "Rejected",
            "kind": "business-rejection",
            "action": "stop"
          },
          {
            "code": "Compensated",
            "kind": "business-rejection",
            "action": "stop"
          },
          {
            "code": "RecoveryRequired",
            "kind": "infrastructure-failure",
            "action": "manual-recovery"
          },
          {
            "code": "Unknown",
            "kind": "unknown-effect",
            "action": "manual-recovery"
          }
        ]
      }
    },
    {
      "id": "await-ta-settlement",
      "name": "Await T+1 TA share confirmation child plan",
      "description": "Start and await the bounded durable fund-ta-settlement Monarch run on its journal.",
      "execution": {
        "awaitChildRun": {
          "childRun": {
            "planRef": {
              "pipelineId": "fund-ta-settlement"
            },
            "identity": {
              "derivation": "durable-parent-step",
              "source": {
                "ref": "input:operation",
                "type": "OperationId"
              },
              "stepId": "await-ta-settlement",
              "stageOccurrence": {
                "ref": "input:occurrence",
                "type": "OperationId"
              },
              "conflict": "reject-different-args"
            },
            "payload": [
              {
                "slot": "investorAccountId",
                "ref": "input:investorAccountId",
                "type": "AccountId"
              },
              {
                "slot": "fundOrderId",
                "ref": "input:fundOrderId",
                "type": "FundOrderId"
              },
              {
                "slot": "amount",
                "ref": "input:amount",
                "type": "Money"
              }
            ],
            "payloadCompatibility": "exact"
          },
          "start": "durable-intent-before-start",
          "completionMode": "await-terminal",
          "results": [
            {
              "resultKind": "succeeded",
              "code": "TACompleted",
              "outputs": [
                {
                  "slot": "shares",
                  "ref": "result:shares",
                  "type": "FundShare"
                },
                {
                  "slot": "childRun",
                  "ref": "result:childRun",
                  "type": "OperationId"
                }
              ]
            },
            {
              "resultKind": "child-rejected",
              "code": "TARejected",
              "outputs": []
            },
            {
              "resultKind": "child-failed",
              "code": "TAFailed",
              "outputs": []
            },
            {
              "resultKind": "recovery-required",
              "code": "RecoveryRequired",
              "outputs": []
            },
            {
              "resultKind": "outcome-unknown",
              "code": "Unknown",
              "outputs": []
            }
          ]
        },
        "reads": [
          {
            "slot": "operation",
            "ref": "input:operation",
            "type": "OperationId"
          },
          {
            "slot": "occurrence",
            "ref": "input:occurrence",
            "type": "OperationId"
          },
          {
            "slot": "investorAccountId",
            "ref": "input:investorAccountId",
            "type": "AccountId"
          },
          {
            "slot": "fundOrderId",
            "ref": "input:fundOrderId",
            "type": "FundOrderId"
          },
          {
            "slot": "amount",
            "ref": "input:amount",
            "type": "Money"
          }
        ],
        "writes": [
          {
            "id": "shares",
            "slot": "shares",
            "type": "FundShare",
            "durability": "durable-reference"
          },
          {
            "id": "childRun",
            "slot": "childRun",
            "type": "OperationId",
            "durability": "durable-reference"
          }
        ],
        "outcomes": [
          {
            "code": "TACompleted",
            "kind": "success",
            "action": "continue"
          },
          {
            "code": "TARejected",
            "kind": "business-rejection",
            "action": "stop"
          },
          {
            "code": "TAFailed",
            "kind": "business-rejection",
            "action": "stop"
          },
          {
            "code": "RecoveryRequired",
            "kind": "infrastructure-failure",
            "action": "manual-recovery"
          },
          {
            "code": "Unknown",
            "kind": "unknown-effect",
            "action": "manual-recovery"
          }
        ]
      }
    }
  ]
execution:
  {
    "schemaVersion": "truthsrc.execution/v1",
    "inputs": [
      {
        "id": "operation",
        "type": "OperationId",
        "durability": "start-record"
      },
      {
        "id": "occurrence",
        "type": "OperationId",
        "durability": "durable-reference"
      },
      {
        "id": "investorAccountId",
        "type": "AccountId",
        "durability": "start-record"
      },
      {
        "id": "fundOrderId",
        "type": "FundOrderId",
        "durability": "start-record"
      },
      {
        "id": "amount",
        "type": "Money",
        "durability": "start-record"
      }
    ],
    "outputs": [
      {
        "id": "paymentTxid",
        "ref": "step:pay-subscription:paymentTxid",
        "type": "TxId"
      },
      {
        "id": "confirmedShares",
        "ref": "step:await-ta-settlement:shares",
        "type": "FundShare"
      },
      {
        "id": "taChildRun",
        "ref": "step:await-ta-settlement:childRun",
        "type": "OperationId"
      }
    ],
    "recovery": {
      "inputResponsibility": "host",
      "inputs": [
        "input:operation",
        "input:occurrence",
        "input:investorAccountId",
        "input:fundOrderId",
        "input:amount"
      ],
      "planVersion": "plan-v1",
      "planCompatibility": "exact",
      "checkpoint": "confirmed-prefix",
      "unknownEffect": "reconcile-before-resume",
      "ownership": "single-writer"
    },
    "admission": {
      "maxConcurrentRuns": 1,
      "maxInFlightSteps": 1,
      "maxItemsPerChunk": 1,
      "maxInFlightChunks": 1
    }
  }
