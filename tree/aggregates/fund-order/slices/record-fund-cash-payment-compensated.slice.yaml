# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RecordFundCashPaymentCompensated
payload:
  {
    "name": "RecordFundCashPaymentCompensated",
    "description": "Trusted-host-only cash-v2 compensated publication for the exact persisted start/source-event association; TxId-only completion is not sender authentication. Recoverable observations are nonterminal, terminal conflicts reject and same finals are empty success. Does not mutate order/TA/refund lifecycle.",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "PROPAGATED"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-V2-ONLY",
        "errCode": "62104",
        "cond": "state.contractVersion == \"cash-purchase-v2\"",
        "desc": "New TA/refund lifecycle requires the cash-purchase-v2 request contract; legacy PAYMENT_SETTLED is insufficient."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-RESULT-ASSOCIATION",
        "errCode": "62140",
        "cond": "state.cashPaymentFinalResults.keys.forall(_ == param.txid) && state.cashPaymentResults.keys.forall(_ == param.txid) && state.reservedSubscriptions.keys.forall(_ == param.txid) && state.committedSubscriptions.keys.forall(_ == param.txid) && state.compensatedSubscriptions.keys.forall(_ == param.txid)",
        "desc": "Cash result txid must be the sole cash payment identity across outcome and order phase evidence. First publication additionally requires the trusted durable start/source-event association; no commit is required for rejected/compensated/nonterminal kinds. Schema cannot authenticate that association."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-RESULT-FINAL-CONFLICT",
        "errCode": "62141",
        "cond": "!state.cashPaymentFinalResults.contains(param.txid) || state.cashPaymentFinalResults(param.txid) == \"compensated\"",
        "desc": "An established terminal cash outcome is immutable: a different terminal or any later nonterminal result rejects before duplicate success."
      },
      {
        "ruleId": "IR-FO-CASH-RESULT-FINAL-ONCE",
        "errCode": "62142",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "cashPaymentFinalResults",
          "key": "param.txid"
        },
        "desc": "Same authenticated terminal kind for the bound txid is empty success; recoverable/unknown observations do not occupy this terminal map."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-RESULT-NO-COMMIT",
        "errCode": "62144",
        "cond": "state.committedSubscriptions.isEmpty",
        "desc": "Rejected-before-effects/compensated final cash outcomes cannot contradict an already committed order; forward recovery after durable commit is not compensation."
      }
    ],
    "produces": [
      "FundCashPaymentCompensated"
    ],
    "provenance": {
      "source": "Approved second batch cash outcome repair",
      "workshopHeld": false,
      "contractVersion": "cash-purchase-v2"
    }
  }
events:
  {
    "FundCashPaymentCompensated": {
      "name": "FundCashPaymentCompensated",
      "description": "Trusted-host-only cash-v2 compensated publication for the exact persisted start/source-event association; TxId-only completion is not sender authentication. Recoverable observations are nonterminal, terminal conflicts reject and same finals are empty success. Does not mutate order/TA/refund lifecycle.",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "cashPaymentResults",
          "op": "put",
          "key": "event.txid",
          "value": "literal:compensated"
        },
        {
          "slot": "cashPaymentFinalResults",
          "op": "put",
          "key": "event.txid",
          "value": "literal:compensated"
        }
      ]
    }
  }
