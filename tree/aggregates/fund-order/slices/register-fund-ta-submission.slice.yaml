# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RegisterFundTASubmission
payload:
  {
    "name": "RegisterFundTASubmission",
    "description": "Register the exact selected paid cash order TA request; trusted host must first verify collection commit and exact payment Saga success. This command does not call TA or certify that host bridge.",
    "parameters": [
      {
        "name": "fundOrderId",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "paymentTxId",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "taRequestId",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-V2-ONLY",
        "errCode": "62104",
        "cond": "state.contractVersion == \"cash-purchase-v2\"",
        "desc": "New TA/refund lifecycle requires the cash-purchase-v2 request contract; legacy PAYMENT_SETTLED is insufficient."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-RESOURCE",
        "errCode": "62105",
        "cond": "param.fundOrderId == state.id",
        "desc": "Command must address the retained original FundOrder identity."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-PAYMENT",
        "errCode": "62106",
        "cond": "param.paymentTxId == state.selectedPaymentTxId",
        "desc": "Payment correlation must exactly match the selected original committed payment transaction."
      },
      {
        "ruleId": "IR-FO-CASH-COMMITTED",
        "errCode": "62107",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "committedSubscriptions",
          "key": "param.paymentTxId"
        },
        "desc": "Selected payment requires durable FundOrder committedSubscriptions evidence."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-SUCCEEDED",
        "errCode": "62108",
        "cond": "state.cashPaymentFinalResults.get(param.paymentTxId).contains(\"succeeded\")",
        "desc": "Selected cash payment requires succeeded evidence; collection receipt and exact Saga identity/version/args digest still require a trusted host bridge."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-REQUEST-NONEMPTY",
        "errCode": "62109",
        "cond": "param.taRequestId.nonEmpty",
        "desc": "TA request identity must be nonempty."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-REQUEST-CONFLICT",
        "errCode": "62110",
        "cond": "(state.taRequestId.isEmpty || state.taRequestId == param.taRequestId) && (!state.taRequests.contains(param.taRequestId) || state.taRequests(param.taRequestId) == param.paymentTxId)",
        "desc": "A different TA request identity cannot replace an existing submission."
      },
      {
        "ruleId": "IR-FO-TA-REQUEST-ONCE",
        "errCode": "62111",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "taRequests",
          "key": "param.taRequestId"
        },
        "desc": "Registered TA request key already exists: map-absent succeed-empty follows exact payment/request conflict checks and precedes lifecycle guard."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-SUBMIT-PHASE",
        "errCode": "62112",
        "cond": "state.status == \"PAYMENT_SETTLED\"",
        "desc": "First TA registration requires payment settled, not merely reserved or canceled."
      }
    ],
    "produces": [
      "FundTASubmissionRegistered"
    ],
    "provenance": {
      "source": "Approved second batch agent-assisted proposal",
      "workshopHeld": false,
      "contractVersion": "cash-purchase-v2"
    }
  }
events:
  {
    "FundTASubmissionRegistered": {
      "name": "FundTASubmissionRegistered",
      "description": "Register the exact selected paid cash order TA request; trusted host must first verify collection commit and exact payment Saga success. This command does not call TA or certify that host bridge.",
      "payloads": [
        {
          "name": "fundOrderId",
          "dataType": "FundOrderId",
          "origin": "PROPAGATED"
        },
        {
          "name": "paymentTxId",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "taRequestId",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "fundOrderId",
          "expr": "param.fundOrderId"
        },
        {
          "slot": "paymentTxId",
          "expr": "param.paymentTxId"
        },
        {
          "slot": "taRequestId",
          "expr": "param.taRequestId"
        }
      ],
      "foldAssignments": [
        {
          "slot": "taRequestId",
          "expr": "event.taRequestId"
        },
        {
          "slot": "status",
          "expr": "literal:TA_SUBMITTED"
        },
        {
          "slot": "taStatus",
          "expr": "literal:TA_SUBMITTED"
        },
        {
          "slot": "taRequests",
          "op": "put",
          "key": "event.taRequestId",
          "value": "event.paymentTxId"
        }
      ]
    }
  }
