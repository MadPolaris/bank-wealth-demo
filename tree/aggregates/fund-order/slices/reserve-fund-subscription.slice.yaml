# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: ReserveFundSubscription
payload:
  {
    "name": "ReserveFundSubscription",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "amount",
        "dataType": "Money",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ReserveFundSubscriptionConfirmed"
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-TCC-PREPARE",
        "errCode": "62180",
        "desc": "For cash-v2 only: subscription phase must address this order, exact original Money, unresolved request, and a single stable prepared txid; reject different args before existing duplicate empty success. Legacy TCC behavior remains unchanged.",
        "cond": "state.contractVersion != \"cash-purchase-v2\" || (param.resource == state.id && state.cashPaymentFinalResults.isEmpty && state.cashPaymentResults.keys.forall(_ == param.txid) && param.amount == state.amount && (state.status == \"REQUESTED\" || state.status == \"SUBSCRIPTION_RESERVED\") && state.committedSubscriptions.isEmpty && state.compensatedSubscriptions.isEmpty && state.reservedSubscriptions.keys.forall(_ == param.txid) && (!state.reservedSubscriptions.contains(param.txid) || state.reservedSubscriptions(param.txid) == param.amount))"
      },
      {
        "ruleId": "IR-FO-RESERVE-001",
        "errCode": "62001",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "reservedSubscriptions",
          "key": "param.txid"
        },
        "desc": "Subscription already reserved for this transaction: idempotent success."
      },
      {
        "ruleId": "IR-FO-RESERVE-002",
        "errCode": "62004",
        "onFail": "reject",
        "when": {
          "form": "money-positive",
          "amount": "param.amount"
        },
        "desc": "Subscription amount must be positive."
      }
    ],
    "description": "TCC Prepare phase on FundOrder: reserve fund subscription quota under transaction identity.",
    "changeProvenance": {
      "baselineCommit": "dda2f24f4569bc4e6468b4339dcea9fdb983a63d",
      "source": "Approved cash-only compatibility conditions; existing TCC parameters/event slots unchanged; retained sourceCapture not recursively copied"
    }
  }
events:
  {
    "ReserveFundSubscriptionConfirmed": {
      "name": "ReserveFundSubscriptionConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "amount",
          "dataType": "Money",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Durable fact: fund subscription quota reserved under transaction identity.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "amount",
          "expr": "param.amount"
        }
      ],
      "foldAssignments": [
        {
          "slot": "reservedSubscriptions",
          "op": "put",
          "key": "event.txid",
          "value": "event.amount"
        },
        {
          "slot": "status",
          "expr": "literal:SUBSCRIPTION_RESERVED"
        }
      ]
    }
  }
