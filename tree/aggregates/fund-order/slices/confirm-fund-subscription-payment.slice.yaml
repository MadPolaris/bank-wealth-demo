# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: ConfirmFundSubscriptionPayment
payload:
  {
    "name": "ConfirmFundSubscriptionPayment",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "FundSubscriptionPaymentConfirmed"
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-TCC-COMMIT",
        "errCode": "62181",
        "desc": "For cash-v2 only: confirm only this order and exact retained reservation once; payment confirmation cannot reset a later TA/refund lifecycle or select another payment. Collection receipt/order-last sequencing is a trusted host requirement.",
        "cond": "state.contractVersion != \"cash-purchase-v2\" || (param.resource == state.id && state.cashPaymentFinalResults.isEmpty && state.cashPaymentResults.keys.forall(_ == param.txid) && state.status == \"SUBSCRIPTION_RESERVED\" && state.reservedSubscriptions.get(param.txid).contains(state.amount) && state.committedSubscriptions.isEmpty)"
      },
      {
        "ruleId": "IR-FO-COMMIT-001",
        "errCode": "62008",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "reservedSubscriptions",
          "key": "param.txid"
        },
        "desc": "Prepared subscription cannot be found or already committed."
      }
    ],
    "description": "TCC Commit phase on FundOrder: confirm payment settlement and mark order ready for TA submission.",
    "changeProvenance": {
      "baselineCommit": "dda2f24f4569bc4e6468b4339dcea9fdb983a63d",
      "source": "Approved cash-only compatibility conditions; existing TCC parameters/event slots unchanged; retained sourceCapture not recursively copied"
    }
  }
events:
  {
    "FundSubscriptionPaymentConfirmed": {
      "name": "FundSubscriptionPaymentConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Durable fact: fund subscription payment settled.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "committedSubscriptions",
          "op": "put",
          "key": "event.txid",
          "value": "state.reservedSubscriptions[event.txid]"
        },
        {
          "slot": "reservedSubscriptions",
          "op": "remove",
          "key": "event.txid"
        },
        {
          "slot": "status",
          "expr": "literal:PAYMENT_SETTLED"
        },
        {
          "slot": "selectedPaymentTxId",
          "expr": "event.txid"
        }
      ]
    }
  }
