# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RecordFundTAAccepted
payload:
  {
    "name": "RecordFundTAAccepted",
    "description": "Correlated cash-v2 TA accepted receipt; exact-body duplicate/conflict declarations precede phase guard. Canonical receipt-to-typed-slot validation and trusted sender remain required host obligations.",
    "parameters": [
      {
        "name": "fundOrderId",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "paymentTxId",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "taRequestId",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "taReference",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptId",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptBody",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "fundCode",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "currency",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-V2-ONLY",
        "errCode": "62104",
        "cond": "state.contractVersion == \"cash-purchase-v2\"",
        "desc": "New TA/refund lifecycle requires the cash-purchase-v2 request contract; legacy PAYMENT_SETTLED is insufficient."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-RESOURCE",
        "errCode": "62105",
        "cond": "param.fundOrderId == state.id",
        "desc": "Command must address the retained original FundOrder identity."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-PAYMENT",
        "errCode": "62106",
        "cond": "param.paymentTxId == state.selectedPaymentTxId",
        "desc": "Payment correlation must exactly match the selected original committed payment transaction."
      },
      {
        "ruleId": "IR-FO-CASH-COMMITTED",
        "errCode": "62107",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "committedSubscriptions",
          "key": "param.paymentTxId"
        },
        "desc": "Selected payment requires durable FundOrder committedSubscriptions evidence."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-CASH-SUCCEEDED",
        "errCode": "62108",
        "cond": "state.cashPaymentFinalResults.get(param.paymentTxId).contains(\"succeeded\")",
        "desc": "Selected cash payment requires succeeded evidence; collection receipt and exact Saga identity/version/args digest still require a trusted host bridge."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-CORRELATION",
        "errCode": "62113",
        "cond": "param.taRequestId.nonEmpty && param.taRequestId == state.taRequestId && param.taReference.nonEmpty && (state.taReference.isEmpty || state.taReference == param.taReference) && param.fundCode == state.fundCode && param.currency == state.amount.currency && param.currency == \"CNY\" && state.taRequests.get(param.taRequestId).contains(param.paymentTxId)",
        "desc": "TA order/payment/request/reference/fund/currency association must match the retained cash purchase."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-RECEIPT-NONEMPTY",
        "errCode": "62114",
        "cond": "param.receiptId.nonEmpty && param.receiptBody.nonEmpty",
        "desc": "Exact TA receipt identity/body must be nonempty; trusted canonical codec must additionally validate body against every typed slot."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-RECEIPT-CONFLICT",
        "errCode": "62115",
        "cond": "!state.taReceipts.contains(param.receiptId) || state.taReceipts(param.receiptId) == param.receiptBody",
        "desc": "An existing receiptId with a different exact String body is a conflict, even after terminal phase."
      },
      {
        "ruleId": "IR-FO-TA-RECEIPT-ONCE",
        "errCode": "62116",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "taReceipts",
          "key": "param.receiptId"
        },
        "desc": "Identical receipt body under the same receiptId is empty success before TA phase guards; authored mixed guard order must be enforced by a future generator/host."
      },
      {
        "kind": "invariantRef",
        "ref": "IR-FO-TA-ACCEPTED-PHASE",
        "errCode": "62117",
        "cond": "state.taStatus == \"TA_SUBMITTED\" && state.status == \"TA_SUBMITTED\"",
        "desc": "Only a submitted/accepted unresolved TA lifecycle may accept a new receipt of this kind."
      }
    ],
    "produces": [
      "FundTAAccepted"
    ],
    "provenance": {
      "source": "Approved second batch agent-assisted proposal",
      "workshopHeld": false,
      "contractVersion": "cash-purchase-v2"
    }
  }
events:
  {
    "FundTAAccepted": {
      "name": "FundTAAccepted",
      "description": "Correlated cash-v2 TA accepted receipt; exact-body duplicate/conflict declarations precede phase guard. Canonical receipt-to-typed-slot validation and trusted sender remain required host obligations.",
      "payloads": [
        {
          "name": "fundOrderId",
          "dataType": "FundOrderId",
          "origin": "PROPAGATED"
        },
        {
          "name": "paymentTxId",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "taRequestId",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "taReference",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptId",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptBody",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "fundCode",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "currency",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "observationKind",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "fundOrderId",
          "expr": "param.fundOrderId"
        },
        {
          "slot": "paymentTxId",
          "expr": "param.paymentTxId"
        },
        {
          "slot": "taRequestId",
          "expr": "param.taRequestId"
        },
        {
          "slot": "taReference",
          "expr": "param.taReference"
        },
        {
          "slot": "receiptId",
          "expr": "param.receiptId"
        },
        {
          "slot": "receiptBody",
          "expr": "param.receiptBody"
        },
        {
          "slot": "fundCode",
          "expr": "param.fundCode"
        },
        {
          "slot": "currency",
          "expr": "param.currency"
        },
        {
          "slot": "observationKind",
          "expr": "literal:ACCEPTED"
        }
      ],
      "foldAssignments": [
        {
          "slot": "taReceipts",
          "op": "put",
          "key": "event.receiptId",
          "value": "event.receiptBody"
        },
        {
          "slot": "taReference",
          "expr": "event.taReference"
        },
        {
          "slot": "taObservation",
          "expr": "literal:ACCEPTED"
        },
        {
          "slot": "status",
          "expr": "literal:TA_ACCEPTED"
        },
        {
          "slot": "taStatus",
          "expr": "literal:TA_ACCEPTED"
        }
      ]
    }
  }
