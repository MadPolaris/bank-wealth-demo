# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: ExternalTransferOrder
command: CompensateExternalDebit
payload:
  {
    "name": "CompensateExternalDebit",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "ExternalOrderId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ExternalDebitCompensated"
    ],
    "guards": [
      {
        "ruleId": "IR-EXT-COMPENSATE-001",
        "errCode": "61004",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "preparedDebits",
          "key": "param.txid"
        },
        "desc": "No prepared external debit found to compensate for this transaction."
      }
    ],
    "description": "TCC Compensate phase on ExternalTransferOrder: release cross-bank debit hold."
  }
events:
  {
    "ExternalDebitCompensated": {
      "name": "ExternalDebitCompensated",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Durable fact: prepared cross-bank debit hold was released.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "compensatedDebits",
          "op": "put",
          "key": "event.txid",
          "value": "state.preparedDebits[event.txid]"
        },
        {
          "slot": "preparedDebits",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
