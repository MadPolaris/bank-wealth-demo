# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: ExternalTransferOrder
command: CommitExternalDebit
payload:
  {
    "name": "CommitExternalDebit",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "ExternalOrderId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ExternalDebitCommitted"
    ],
    "guards": [
      {
        "ruleId": "IR-EXT-COMMIT-001",
        "errCode": "61003",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "preparedDebits",
          "key": "param.txid"
        },
        "desc": "No prepared external debit found for this transaction."
      }
    ],
    "description": "TCC Commit phase on ExternalTransferOrder: finalize cross-bank clearing settlement."
  }
events:
  {
    "ExternalDebitCommitted": {
      "name": "ExternalDebitCommitted",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Durable fact: prepared cross-bank debit was committed.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "committedDebits",
          "op": "put",
          "key": "event.txid",
          "value": "state.preparedDebits[event.txid]"
        },
        {
          "slot": "preparedDebits",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
