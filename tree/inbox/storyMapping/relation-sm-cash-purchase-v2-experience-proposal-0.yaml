          "feedbackRules": [
            "付款结果是独立维度：订单PAYMENT_SETTLED标记不单独证明完整付款成功；显示结果须经关联付款桥认证。",
            "TA未知是观测：恢复到确认/拒绝后，旧unknown记录不覆盖新终态；退款unknown同理。",
            "不同身份的TA受理与确认分别展示；同身份同正文去重，同身份异正文显示冲突并停止自动推进。",
            "仅TA_REJECTED + 成功付款与原请求证据授权独立退款；无投资者按钮接受自选退款金额/收款人。",
