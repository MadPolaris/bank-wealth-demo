kind: slice
aggregate: SipPlan
command: AdvanceSkippedSipSlot
payload:
  {
    "name": "AdvanceSkippedSipSlot",
    "parameters": [
      {
        "name": "position",
        "dataType": "Long",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "dueSlot",
        "dataType": "Long",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "SIP_INITIALIZED",
        "errCode": "SIP_INITIALIZED",
        "cond": "state.initialized",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SCHEDULE_SEALED",
        "errCode": "SIP_SCHEDULE_SEALED",
        "cond": "state.scheduleSealed",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SLOT_DECLARED",
        "errCode": "SIP_SLOT_DECLARED",
        "cond": "state.slots.contains(param.position)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SLOT_MATCH",
        "errCode": "SIP_SLOT_MATCH",
        "cond": "state.slots(param.position) == param.dueSlot",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SKIP_RECORDED",
        "errCode": "SIP_SKIP_RECORDED",
        "cond": "state.slotDisposition.get(param.dueSlot).contains(\"skipped\")",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SKIP_CURSOR_ONCE",
        "errCode": "SIP_SKIP_CURSOR_ONCE",
        "cond": "param.position >= state.startCount",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_SKIP_CURSOR_ORDER",
        "errCode": "SIP_SKIP_CURSOR_ORDER",
        "cond": "param.position == state.startCount",
        "onFail": "reject"
      }
    ],
    "produces": [
      "SipSkippedSlotAdvanced"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipSkippedSlotAdvanced": {
      "name": "SipSkippedSlotAdvanced",
      "payloads": [
        {
          "name": "position",
          "dataType": "Long",
          "origin": "PROPAGATED"
        },
        {
          "name": "dueSlot",
          "dataType": "Long",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "position",
          "expr": "param.position"
        },
        {
          "slot": "dueSlot",
          "expr": "param.dueSlot"
        }
      ],
      "foldAssignments": [
        {
          "slot": "startCount",
          "op": "integer-apply",
          "delta": "literal:1",
          "sign": 1
        }
      ]
    }
  }
