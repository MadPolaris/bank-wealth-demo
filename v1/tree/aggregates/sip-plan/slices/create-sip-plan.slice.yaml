# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: SipPlan
command: CreateSipPlan
payload:
  {
    "name": "CreateSipPlan",
    "parameters": [
      {
        "name": "planId",
        "dataType": "PlanId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "config",
        "dataType": "SipRevisionConfig",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "SIP_PLAN_ID",
        "errCode": "SIP_PLAN_ID",
        "cond": "param.planId.value.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CREATE_CONFLICT",
        "errCode": "SIP_CREATE_CONFLICT",
        "cond": "!state.initialized || (param.planId == state.id && state.revisions.contains(param.config.revision) && state.revisions(param.config.revision) == param.config)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CREATE_ONCE",
        "errCode": "SIP_CREATE_ONCE",
        "cond": "!state.initialized",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_REVISION_ID",
        "errCode": "SIP_REVISION_ID",
        "cond": "param.config.revision.value.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_EFFECTIVE_SLOT",
        "errCode": "SIP_EFFECTIVE_SLOT",
        "cond": "param.config.effectiveSlot >= 0",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CONFIG_ACCOUNTS",
        "errCode": "SIP_CONFIG_ACCOUNTS",
        "cond": "param.config.investorAccountId.value.nonEmpty && param.config.fundCollectionAccountId.value.nonEmpty && param.config.investorAccountId != param.config.fundCollectionAccountId",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CONFIG_FUND",
        "errCode": "SIP_CONFIG_FUND",
        "cond": "param.config.fundCode.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "SIP_CONFIG_AMOUNT",
        "errCode": "SIP_CONFIG_AMOUNT",
        "cond": "param.config.amount.currency == \"CNY\" && param.config.amount.amount > 0.00",
        "onFail": "reject"
      }
    ],
    "produces": [
      "SipPlanCreated"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "sip",
      "sourceArtifact": "decision.p23-bank-v1-handoff",
      "sourcePointers": [
        "/payload/info/artifact/body/resolutions/2",
        "/payload/info/artifact/body/resolutions/3",
        "/payload/info/artifact/body/resolutions/4",
        "/payload/info/artifact/body/flows/3"
      ]
    }
  }
events:
  {
    "SipPlanCreated": {
      "name": "SipPlanCreated",
      "payloads": [
        {
          "name": "planId",
          "dataType": "PlanId",
          "origin": "PROPAGATED"
        },
        {
          "name": "config",
          "dataType": "SipRevisionConfig",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "planId",
          "expr": "param.planId"
        },
        {
          "slot": "config",
          "expr": "param.config"
        }
      ],
      "foldAssignments": [
        {
          "slot": "id",
          "expr": "event.planId"
        },
        {
          "slot": "initialized",
          "expr": "literal:true"
        },
        {
          "slot": "revisions",
          "op": "put",
          "key": "event.config.revision",
          "value": "event.config"
        },
        {
          "slot": "latestRevision",
          "expr": "event.config.revision"
        },
        {
          "slot": "latestEffectiveSlot",
          "expr": "event.config.effectiveSlot"
        }
      ]
    }
  }
