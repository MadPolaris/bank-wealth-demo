kind: slice
aggregate: FundOrder
command: RequestFundPurchaseSettlement
payload:
  {
    "name": "RequestFundPurchaseSettlement",
    "parameters": [
      {
        "name": "operationId",
        "dataType": "OperationId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "fundOrderId",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "investorAccountId",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "fundCollectionAccountId",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "fundCode",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "amount",
        "dataType": "Money",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "ORDER_RESOURCE",
        "errCode": "ORDER_RESOURCE",
        "cond": "param.fundOrderId == state.id",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ORDER_REPLAY_CONFLICT",
        "errCode": "ORDER_REPLAY_CONFLICT",
        "cond": "state.status == \"new\" || (param.operationId == state.operationId && param.investorAccountId == state.investorAccountId && param.fundCollectionAccountId == state.fundCollectionAccountId && param.fundCode == state.fundCode && param.amount == state.amount)",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ORDER_REQUEST_ONCE",
        "errCode": "ORDER_REQUEST_ONCE",
        "cond": "state.status == \"new\"",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "ORDER_ACCOUNTS",
        "errCode": "ORDER_ACCOUNTS",
        "cond": "param.investorAccountId != param.fundCollectionAccountId",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ORDER_AMOUNT",
        "errCode": "ORDER_AMOUNT",
        "cond": "param.amount.currency == \"CNY\" && param.amount.amount > 0.00",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "ORDER_OPERATION",
        "errCode": "ORDER_OPERATION",
        "cond": "param.operationId.value.nonEmpty && param.fundCode.nonEmpty",
        "onFail": "reject"
      }
    ],
    "produces": [
      "FundPurchaseSettlementRequested"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
