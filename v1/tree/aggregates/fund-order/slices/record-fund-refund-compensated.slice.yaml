# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RecordFundRefundCompensated
payload:
  {
    "name": "RecordFundRefundCompensated",
    "parameters": [
      {
        "name": "refundTxId",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "refundOperationId",
        "dataType": "OperationId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptId",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "receiptBody",
        "dataType": "String",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "REFUND_RESULT_ASSOCIATION",
        "errCode": "REFUND_RESULT_ASSOCIATION",
        "cond": "param.refundOperationId == state.refundOperationId && param.refundOperationId.value.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_RECEIPT_PRESENT",
        "errCode": "REFUND_RECEIPT_PRESENT",
        "cond": "param.refundTxId.value.nonEmpty && param.receiptId.nonEmpty && param.receiptBody.nonEmpty",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_RECEIPT_CONFLICT",
        "errCode": "REFUND_RECEIPT_CONFLICT",
        "cond": "!state.refundResultReceipts.contains(param.receiptId) || state.refundResultReceipts(param.receiptId) == param.receiptBody",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_TERMINAL_CONFLICT",
        "errCode": "REFUND_TERMINAL_CONFLICT",
        "cond": "!state.refundFinalResults.contains(param.refundTxId) || state.refundFinalResults(param.refundTxId) == \"compensated\"",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_RECEIPT_ONCE",
        "errCode": "REFUND_RECEIPT_ONCE",
        "cond": "!state.refundResultReceipts.contains(param.receiptId)",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_TERMINAL_ONCE",
        "errCode": "REFUND_TERMINAL_ONCE",
        "cond": "!state.refundFinalResults.contains(param.refundTxId)",
        "onFail": "succeed-empty"
      }
    ],
    "produces": [
      "FundRefundCompensated"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundRefundCompensated": {
      "name": "FundRefundCompensated",
      "payloads": [
        {
          "name": "refundTxId",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "refundOperationId",
          "dataType": "OperationId",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptId",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "receiptBody",
          "dataType": "String",
          "origin": "PROPAGATED"
        },
        {
          "name": "kind",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "refundTxId",
          "expr": "param.refundTxId"
        },
        {
          "slot": "refundOperationId",
          "expr": "param.refundOperationId"
        },
        {
          "slot": "receiptId",
          "expr": "param.receiptId"
        },
        {
          "slot": "receiptBody",
          "expr": "param.receiptBody"
        },
        {
          "slot": "kind",
          "expr": "literal:compensated"
        }
      ],
      "foldAssignments": [
        {
          "slot": "refundResultReceipts",
          "op": "put",
          "key": "event.receiptId",
          "value": "event.receiptBody"
        },
        {
          "slot": "refundOutcome",
          "expr": "event.kind"
        },
        {
          "slot": "refundFinalResults",
          "op": "put",
          "key": "event.refundTxId",
          "value": "event.kind"
        }
      ]
    }
  }
