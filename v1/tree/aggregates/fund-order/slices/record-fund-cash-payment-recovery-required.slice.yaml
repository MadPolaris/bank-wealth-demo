# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RecordFundCashPaymentRecoveryRequired
payload:
  {
    "name": "RecordFundCashPaymentRecoveryRequired",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "PAYMENT_LATE_PROGRESS",
        "errCode": "PAYMENT_LATE_PROGRESS",
        "cond": "!state.cashPaymentFinalResults.contains(param.txid)",
        "onFail": "succeed-empty"
      },
      {
        "kind": "invariantRef",
        "ref": "PAYMENT_PROGRESS_ONCE",
        "errCode": "PAYMENT_PROGRESS_ONCE",
        "cond": "!state.cashPaymentResults.get(param.txid).contains(\"recovery-required\")",
        "onFail": "succeed-empty"
      }
    ],
    "produces": [
      "FundCashPaymentRecoveryRequired"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundCashPaymentRecoveryRequired": {
      "name": "FundCashPaymentRecoveryRequired",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "kind",
          "dataType": "String",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "kind",
          "expr": "literal:recovery-required"
        }
      ],
      "foldAssignments": [
        {
          "slot": "cashPaymentResults",
          "op": "put",
          "key": "event.txid",
          "value": "event.kind"
        },
        {
          "slot": "paymentOutcome",
          "expr": "event.kind"
        }
      ]
    }
  }
