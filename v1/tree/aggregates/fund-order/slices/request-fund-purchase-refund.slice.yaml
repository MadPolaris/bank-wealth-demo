# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RequestFundPurchaseRefund
payload:
  {
    "name": "RequestFundPurchaseRefund",
    "parameters": [
      {
        "name": "fundOrderId",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "paymentTxId",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "REFUND_RESOURCE",
        "errCode": "REFUND_RESOURCE",
        "cond": "param.fundOrderId == state.id",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_PAYMENT",
        "errCode": "REFUND_PAYMENT",
        "cond": "param.paymentTxId == state.selectedPaymentTxId && state.cashPaymentFinalResults.get(param.paymentTxId).contains(\"succeeded\")",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_TA_REJECTED",
        "errCode": "REFUND_TA_REJECTED",
        "cond": "state.taStatus == \"rejected\"",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "REFUND_INTENT_ONCE",
        "errCode": "REFUND_INTENT_ONCE",
        "cond": "state.refundOperationId.value.isEmpty",
        "onFail": "succeed-empty"
      }
    ],
    "produces": [
      "FundPurchaseRefundRequested"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundPurchaseRefundRequested": {
      "name": "FundPurchaseRefundRequested",
      "payloads": [
        {
          "name": "fundOrderId",
          "dataType": "FundOrderId",
          "origin": "PROPAGATED"
        },
        {
          "name": "paymentTxId",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "investorAccountId",
          "dataType": "AccountId",
          "origin": "PROPAGATED"
        },
        {
          "name": "fundCollectionAccountId",
          "dataType": "AccountId",
          "origin": "PROPAGATED"
        },
        {
          "name": "amount",
          "dataType": "Money",
          "origin": "PROPAGATED"
        },
        {
          "name": "refundOperationId",
          "dataType": "OperationId",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "fundOrderId",
          "expr": "param.fundOrderId"
        },
        {
          "slot": "paymentTxId",
          "expr": "param.paymentTxId"
        },
        {
          "slot": "investorAccountId",
          "expr": "state.investorAccountId"
        },
        {
          "slot": "fundCollectionAccountId",
          "expr": "state.fundCollectionAccountId"
        },
        {
          "slot": "amount",
          "expr": "state.amount"
        },
        {
          "slot": "refundOperationId",
          "expr": {
            "form": "host",
            "id": {
              "context": "bankwealth",
              "kind": "port",
              "owner": [],
              "id": "StableRefundOperationId"
            },
            "version": "bank-v1-1"
          }
        }
      ],
      "foldAssignments": [
        {
          "slot": "refundOperationId",
          "expr": "event.refundOperationId"
        },
        {
          "slot": "refundOutcome",
          "expr": "literal:pending"
        }
      ]
    }
  }
