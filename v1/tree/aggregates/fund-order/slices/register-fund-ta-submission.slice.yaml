# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: FundOrder
command: RegisterFundTASubmission
payload:
  {
    "name": "RegisterFundTASubmission",
    "parameters": [
      {
        "name": "fundOrderId",
        "dataType": "FundOrderId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "paymentTxId",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "guards": [
      {
        "kind": "invariantRef",
        "ref": "TA_SUBMIT_RESOURCE",
        "errCode": "TA_SUBMIT_RESOURCE",
        "cond": "param.fundOrderId == state.id",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_PAID",
        "errCode": "TA_PAID",
        "cond": "param.paymentTxId == state.selectedPaymentTxId && state.cashPaymentFinalResults.get(param.paymentTxId).contains(\"succeeded\")",
        "onFail": "reject"
      },
      {
        "kind": "invariantRef",
        "ref": "TA_SUBMIT_ONCE",
        "errCode": "TA_SUBMIT_ONCE",
        "cond": "state.taRequestId.value.isEmpty",
        "onFail": "succeed-empty"
      }
    ],
    "produces": [
      "FundTASubmissionRegistered"
    ],
    "provenance": {
      "author": "agent-assisted-bank-v1",
      "workshopHeld": false,
      "sourceVersion": "bank-v1-p23-design-2",
      "sourceFlow": "payment/ta/refund"
    }
  }
events:
  {
    "FundTASubmissionRegistered": {
      "name": "FundTASubmissionRegistered",
      "payloads": [
        {
          "name": "fundOrderId",
          "dataType": "FundOrderId",
          "origin": "PROPAGATED"
        },
        {
          "name": "paymentTxId",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        },
        {
          "name": "taRequestId",
          "dataType": "TaRequestId",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "fundOrderId",
          "expr": "param.fundOrderId"
        },
        {
          "slot": "paymentTxId",
          "expr": "param.paymentTxId"
        },
        {
          "slot": "taRequestId",
          "expr": {
            "form": "host",
            "id": {
              "context": "bankwealth",
              "kind": "port",
              "owner": [],
              "id": "StableTaRequestId"
            },
            "version": "bank-v1-1"
          }
        }
      ],
      "foldAssignments": [
        {
          "slot": "taRequestId",
          "expr": "event.taRequestId"
        },
        {
          "slot": "taStatus",
          "expr": "literal:submitted"
        }
      ]
    }
  }
